<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis facturas | ÓpticaVision</title><style>
body{font:16px Arial,sans-serif;background:#edf3f9;color:#17334b;margin:0}main{max-width:1000px;margin:35px auto;padding:25px}h1{color:#125b87}section{background:white;padding:24px;border-radius:12px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #dce6ee}a{color:#126b95}#aviso{color:#a12222}
</style></head><body><main><a href="/cliente/dashboard.html">Volver a mi portal</a><h1>Mis facturas</h1><p>Aquí puedes consultar únicamente los comprobantes asociados a tus compras.</p><p id="aviso" role="status"></p><section style="overflow:auto"><table><thead><tr><th>Venta</th><th>Fecha</th><th>Total (L)</th><th>Estado</th><th>Comprobante</th></tr></thead><tbody id="filas"></tbody></table></section></main><script>
const escapar=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('/api/cliente/ampliacion/facturas',{credentials:'same-origin'}).then(async r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json();}).then(datos=>{document.querySelector('#filas').innerHTML=datos.map(v=>`<tr><td>${escapar(v.idVenta)}</td><td>${escapar(v.fechaVenta)}</td><td>${escapar(v.total)}</td><td>${escapar(v.estado)}</td><td><a target="_blank" rel="noopener" href="/cliente/factura/${encodeURIComponent(v.idVenta)}">Ver / Imprimir</a></td></tr>`).join('')||'<tr><td colspan="5">Aún no tienes compras.</td></tr>';}).catch(e=>document.querySelector('#aviso').textContent='No se pudo cargar: '+e.message);
</script></body></html>
